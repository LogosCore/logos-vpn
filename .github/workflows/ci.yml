name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The end-to-end tests need no root: a second gVisor stack plays the
      # operator's machine.
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # golangci-lint's default linters, no config: 0 issues on each system
      # the client is built for.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.13.2
