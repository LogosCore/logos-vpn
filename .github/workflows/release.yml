name: Release

# A v* tag builds the six binaries (make dist: Wintun's DLL fetched and
# checked against its published hash, embedded on Windows) and attaches
# them to the tag's GitHub release, where core's image takes them from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Our own modules straight from GitHub, not through the public Go proxy:
  # a tag builds the moment it is pushed. go.sum still checks them.
  GOPRIVATE: "github.com/logoscore/*"

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # CI's dist job saved main's compiled packages for these go.mod and
      # go.sum (release.py pushes main and waits for its CI before the tag),
      # so the build is mostly links. Restored, never saved: no other tag
      # could read this one's cache. The paths and key are ci.yml's: keep
      # them alike.
      - name: Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: dist-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: dist-${{ runner.os }}-

      - name: Build
        run: make dist VERSION=${{ github.ref_name }}

      - name: Checksums
        run: cd dist && sha256sum logos-vpn-* > SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" \
            --notes "logos-vpn ${{ github.ref_name }}: the client for Logos's VPN front. SHA256SUMS lists each binary's hash."
